<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <div class="container">
        <div class="top-section">
            <h1>Library</h1>
        </div>

        <div class="library-container">
        </div>
        <div class="sidebar">

        </div>

    </div>
    
    <script src="script.js"></script>
